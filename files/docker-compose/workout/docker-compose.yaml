services:
  web:
    image: docker.io/wger/server:2.5
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - static:/home/wger/static
      - media:/home/wger/media
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: 5
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
    #   interval: 10s
    #   timeout: 5s
    #   start_period: 300s
    #   retries: 5
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # App (default); Traefik prefers longer rules, so /static and /media go to workout-static
      - "traefik.http.routers.workout.rule=Host(`workout.{{ domain }}`)"
      - "traefik.http.routers.workout.entrypoints=websecure"
      - "traefik.http.routers.workout.tls=true"
      - "traefik.http.routers.workout.tls.certresolver=letsencrypt"
      - "traefik.http.routers.workout.service=workout-app"
      - "traefik.http.services.workout-app.loadbalancer.server.port=8000"
    networks:
      - proxy

  nginx:
    image: docker.io/nginx:stable
    depends_on:
      - web
    volumes:
      - ./config/nginx-static.conf:/etc/nginx/conf.d/default.conf:ro 
      - static:/srv/static:ro
      - media:/srv/media:ro
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.workout-static.rule=Host(`workout.{{ domain }}`) && (PathPrefix(`/static`) || PathPrefix(`/media`))"
      - "traefik.http.routers.workout-static.entrypoints=websecure"
      - "traefik.http.routers.workout-static.tls=true"
      - "traefik.http.routers.workout-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.workout-static.service=workout-static"
      - "traefik.http.services.workout-static.loadbalancer.server.port=80"

  db:
    image: docker.io/postgres:15-alpine
    environment:
      - POSTGRES_USER={{ workout_db_user }}
      - POSTGRES_PASSWORD={{ workout_db_password }}
      - POSTGRES_DB=wger
      - TZ={{ timezone }}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data/
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: 5
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wger" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - proxy

  cache:
    image: docker.io/redis
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: 5
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis-data:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - proxy
    # You probably want to limit the memory usage of the cache, otherwise it might
    # hog all the available memory. Remove or change according to your needs.
    #mem_limit: 5gb

  celery_worker:
    image: docker.io/wger/server:2.5
    command: /start-worker
    env_file:
      - .env
    volumes:
      - media:/home/wger/media
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: 5
    # depends_on:
    #   web:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "wger", "inspect", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - proxy

  celery_beat:
    image: docker.io/wger/server:2.5
    command: /start-beat
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: 5
    volumes:
      - celery-beat:/home/wger/beat/
    env_file:
      - .env
    depends_on:
      celery_worker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proxy

volumes:
  celery-beat:
  static:
  media:

networks:
  proxy:
    external: true
